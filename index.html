<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>My Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#14202b;--bg:#e9eef1;--side:#0f3d3e;--side2:#164c4d;--line:#d5e0e8;--acc:#0f766e;--surf:#fff;--mute:#5b6b79;--onacc:#fff;--r:10px}
:root[data-theme=dark]{--ink:#e6edf3;--bg:#0d1117;--side:#010409;--side2:#161b22;--line:#30363d;--acc:#2dd4bf;--surf:#161b22;--mute:#8b949e;--onacc:#04201d}
:root[data-theme=midnight]{--ink:#e2e8f0;--bg:#0f172a;--side:#020617;--side2:#1e293b;--line:#334155;--acc:#60a5fa;--surf:#1e293b;--mute:#94a3b8;--onacc:#0b1b33}
:root[data-theme=ocean]{--ink:#0f2740;--bg:#e6f0fa;--side:#0b3a6b;--side2:#12508f;--line:#c9dcef;--acc:#1d6fd1;--mute:#51657a}
:root[data-theme=forest]{--ink:#18261b;--bg:#e8f0e6;--side:#1f4d2e;--side2:#2a6340;--line:#d3e0d0;--acc:#2f8f4e;--mute:#546657}
:root[data-theme=rose]{--ink:#3a1624;--bg:#f8e9ee;--side:#7a1f45;--side2:#932a58;--line:#efd3dc;--acc:#c2255c;--mute:#7d5565}
:root[data-theme=purple]{--ink:#241538;--bg:#efe9f8;--side:#3b1d6b;--side2:#4c2a85;--line:#ddd0f0;--acc:#7c3aed;--mute:#665a7d}
:root[data-theme=amber]{--ink:#2e1d0b;--bg:#f6ecdc;--side:#6b3a0f;--side2:#85490f;--line:#e8d8bd;--acc:#b45309;--mute:#7a6650}
:root[data-theme=mono]{--ink:#1a1a1a;--bg:#ececec;--side:#222;--side2:#353535;--line:#d6d6d6;--acc:#444;--mute:#666}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,select{cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:6px 11px;min-height:38px}
button:hover,select:hover{border-color:var(--acc)}
:focus-visible{outline:3px solid #5eead4;outline-offset:1px}
button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button:disabled{opacity:.4;cursor:default}
aside{width:280px;flex:none;background:var(--side);color:#e6f2f1;display:flex;flex-direction:column;padding:12px;gap:8px;padding-top:max(12px,env(safe-area-inset-top))}
aside h1{font-size:20px;margin:4px 4px 0}
aside input[type=search]{width:100%;padding:10px 12px;border-radius:var(--r);border:0;background:var(--side2);color:#fff}
aside input::placeholder{color:#9cc2c0}
aside button{background:var(--side2);border-color:var(--side2);color:#e6f2f1}
aside .new{background:#5eead4;border:0;color:#052e2b;font-weight:600}
.row{display:flex;gap:6px}.row button{flex:1;font-size:14px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
#list li{padding:9px 12px;border-radius:var(--r);cursor:pointer}
#list li:hover{background:var(--side2)}
#list li.cur{background:var(--surf);color:var(--ink)}
#list b,#list small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list small{opacity:.7}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--surf);border-bottom:1px solid var(--line)}
.g{display:flex;gap:4px;align-items:center}
.sp{flex:1}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surf);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
#menu{display:none}
#scroll{flex:1;overflow:auto;padding:0 12px 60px}
#title{width:min(100%,900px);margin:12px auto 0;display:block;font-size:24px;font-weight:600;border:0;background:transparent;padding:6px 16px}
.page{container-type:inline-size;width:min(100%,900px);margin:8px auto 0}
.plabel{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:14px 2px 4px}
.plabel button{min-height:28px;padding:2px 8px;font-size:12px}
.sheet{position:relative;width:100%;background-color:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(15,61,62,.18);overflow:hidden;background-size:calc(100cqw/28.125) calc(100cqw/28.125)}
.sheet.grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px)}
.sheet.lined{background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.sheet.blank,.sheet.bg{background-image:none}
.sheet textarea{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;background:transparent;font-size:calc(100cqw/45);line-height:calc(100cqw/28.125);padding:0 calc(100cqw/32);outline:none;overflow:hidden}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.drawing .sheet canvas{pointer-events:auto;cursor:crosshair}
.drawing .sheet textarea{pointer-events:none}
.drawing.t-select .sheet canvas{cursor:default}
.dtools{display:none}.drawing .dtools{display:flex}
input[type=range]{width:110px;accent-color:var(--acc);min-height:30px}.val{min-width:24px;font-size:13px;color:var(--mute)}
#colors{flex-wrap:wrap;max-width:340px}
#cust{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
button svg{display:block}
#shapePop{position:fixed;z-index:20;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;flex-direction:column;gap:6px}
#shapePop .sg{display:flex;flex-wrap:wrap;gap:4px;max-width:200px}
#shapePop .sg+.sg{border-top:1px solid var(--line);padding-top:6px}.ib{padding:7px 9px}
.sheet textarea.tbx{inset:auto;border:1.5px dashed var(--acc);background:transparent;z-index:3;overflow:hidden;font-family:system-ui,"Noto Sans Bengali",sans-serif}
.drawing .sheet textarea.tbx{pointer-events:auto}
.fsonly{display:none}
body.fs .fsonly{display:inline-block}
body.fs aside,body.fs #title,body.fs .plabel,body.fs #menu,body.fs #delNote{display:none}
body.fs #scroll{padding:6px 8px 20px;scroll-snap-type:y proximity}
body.fs .page{margin:6px auto 12px;scroll-snap-align:center}
body.fs .bar button,body.fs .bar select{min-height:46px}
aside select{background:var(--side2);border-color:var(--side2);color:#e6f2f1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14202b;color:#fff;padding:10px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (max-width:760px){
  #menu{display:inline-block}
  aside{position:fixed;z-index:5;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none}
  #title{font-size:20px}
}
@media (prefers-reduced-motion:reduce){aside,#toast{transition:none}}
</style>
</head>
<body>
<aside id="side">
  <h1>My Notes</h1>
  <button class="new" id="newBtn">+ New note</button>
  <button id="pdfIn">Import PDF</button>
  <input type="search" id="q" placeholder="Search notes">
  <ul id="list"></ul>
  <select id="theme" aria-label="Theme"><option value="teal">Theme: Teal</option><option value="dark">Theme: Dark</option><option value="midnight">Theme: Midnight blue</option><option value="ocean">Theme: Ocean</option><option value="forest">Theme: Forest</option><option value="rose">Theme: Rose</option><option value="purple">Theme: Purple</option><option value="amber">Theme: Amber</option><option value="mono">Theme: Graphite</option></select>
  <div class="row"><button id="bkp">Backup</button><button id="rst">Restore</button></div>
</aside>

<main id="main">
  <div class="bar">
    <button id="menu">☰ Notes</button>
    <div class="g" id="tools">
      <button data-tool="type" class="on">Type / Scroll</button>
      <button data-tool="select">Select</button>
      <button data-tool="pen">Pen</button>
      <button data-tool="hl">Highlighter</button>
      <button data-tool="er">Eraser</button>
      <button data-tool="tbox">Text box</button>
      <button id="shapeBtn" title="Shapes" aria-label="Shapes">Shapes</button>
    </div>
    <div class="g dtools" id="dtools">
      <span class="g" id="colors"></span>
      <input type="color" id="cust" value="#14202b" title="Custom color" aria-label="Custom color">
      <label class="g">Size <input type="range" id="size" min="1" max="40" value="4"><span class="val" id="sizeV">4</span></label>
    </div>
    <div class="g" id="etools" style="display:none">
      <label class="g">Eraser size <input type="range" id="ersize" min="6" max="80" value="18"><span class="val" id="erV">18</span></label>
      <select id="ermode" aria-label="Eraser mode"><option value="part">Erase part of a stroke</option><option value="whole">Erase whole stroke</option></select>
    </div>
    <span class="sp"></span>
    <button id="addImg">Add image</button>
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="delSel" disabled>Delete selected</button>
    <select id="paper" aria-label="Paper"><option value="grid">Grid</option><option value="lined">Lined</option><option value="blank">Blank</option></select>
    <select id="pcolor" aria-label="Paper color"><option value="white">White paper</option><option value="yellow">Soft yellow</option><option value="gray">Light gray</option><option value="blue">Light blue</option><option value="mint">Mint</option><option value="pink">Pink</option><option value="dark">Dark gray</option><option value="black">Black</option><option value="board">Green board</option></select>
    <select id="ratio" aria-label="Page shape"><option value="a4">Page: Tall (A4)</option><option value="wide">Slide 16:9</option></select>
    <button id="addPage">Add page</button>
    <button id="pdfOut">Export PDF</button>
    <button id="delNote">Delete note</button>
    <button id="prevP" class="fsonly">Previous page</button>
    <button id="nextP" class="fsonly">Next page</button>
    <button id="fsBtn">Full screen</button>
  </div>
  <div id="scroll"><input id="title" placeholder="Title" maxlength="120"><div id="pages"></div></div>
</main>
<input type="file" id="imgFile" accept="image/*" hidden>
<input type="file" id="pdfFile" accept="application/pdf" hidden>
<input type="file" id="jsonFile" accept="application/json" hidden>
<div id="toast" role="status"></div>

<script>
(function(){
var W=900,CELL=W/28.125,$=function(i){return document.getElementById(i)};
var editObj=null,editTA=null,editI=0,FONT='system-ui,"Noto Sans Bengali",sans-serif';
var db=null,notes=[],cur=null,ap=0,tool="type",shapeKind="line",color="#14202b",hist=[],redoS=[],sel=null,penSeen=false,els=[],drag=null;
var COLORS=["#000000","#14202b","#6b7280","#9ca3af","#ffffff","#7f1d1d","#dc2626","#f97316","#f59e0b","#facc15","#a3e635","#16a34a","#065f46","#14b8a6","#06b6d4","#2563eb","#1e3a8a","#6366f1","#9333ea","#d946ef","#ec4899","#be185d","#92400e","#78350f"];
var PAPERS={white:["#ffffff","#d5e0e8","#14202b"],yellow:["#fff9d6","#eadfa6","#2b2410"],gray:["#eceff1","#cfd6da","#14202b"],blue:["#e8f1fd","#c5d8f0","#10243d"],mint:["#e6f6ec","#c3e3cf","#102b1b"],pink:["#fdeaf0","#f0c9d6","#3a1624"],dark:["#23272e","#3a404a","#e8ecf1"],black:["#0b0b0c","#2a2c30","#f0f0f0"],board:["#1f3a2e","#35584a","#f1f5ef"]};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2400)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- storage (IndexedDB) ---------- */
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open("mynotes",1);r.onupgradeneeded=function(){r.result.createObjectStore("notes",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function dbAll(){return new Promise(function(res){var q=db.transaction("notes").objectStore("notes").getAll();q.onsuccess=function(){res(q.result)};q.onerror=function(){res([])}})}
function dbPut(n){if(db)try{db.transaction("notes","readwrite").objectStore("notes").put(n)}catch(e){toast("Could not save — make a backup")}}
var st;function save(n){n=n||cur;if(!n)return;n.updated=Date.now();clearTimeout(st);st=setTimeout(function(){dbPut(n)},300);renderList()}

/* ---------- geometry ---------- */
function bbox(o){
  if(o.t==="i"||o.t==="x")return[o.x,o.y,o.x+o.w,o.y+o.h];
  if(o.t==="h"){var X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9;geom(o).forEach(function(g){g.p.forEach(function(q){X0=Math.min(X0,q[0]);Y0=Math.min(Y0,q[1]);X1=Math.max(X1,q[0]);Y1=Math.max(Y1,q[1])})});return[X0-o.w,Y0-o.w,X1+o.w,Y1+o.w]}
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,m2=o.hl?o.w*2:o.w;
  o.p.forEach(function(q){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});
  return[x0-m2,y0-m2,x1+m2,y1+m2]}
function dseg(x,y,a,b,c,d){var dx=c-a,dy=d-b,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-a)*dx+(y-b)*dy)/l)):0;return Math.hypot(x-(a+t*dx),y-(b+t*dy))}
function hit(o,x,y,tol){
  if(o.t==="i"||o.t==="x"){var b=bbox(o);return x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]}
  if(o.t==="s"){var r=tol+(o.hl?o.w*2:o.w/2+1);if(o.p.length===1)return Math.hypot(x-o.p[0][0],y-o.p[0][1])<r;
    for(var i=1;i<o.p.length;i++)if(dseg(x,y,o.p[i-1][0],o.p[i-1][1],o.p[i][0],o.p[i][1])<r)return true;return false}
  var t=tol+o.w,gs=geom(o);for(var a=0;a<gs.length;a++){var pp=gs[a].p;for(var j=1;j<pp.length;j++)if(dseg(x,y,pp[j-1][0],pp[j-1][1],pp[j][0],pp[j][1])<t)return true}return false}
function xf(o,f){var n={};for(var k in o)n[k]=o[k];
  if(o.t==="s")n.p=o.p.map(function(q){var r=f(q[0],q[1]);return[r[0],r[1],q[2]]});
  else if(o.t==="h"){var a=f(o.x1,o.y1),b=f(o.x2,o.y2);n.x1=a[0];n.y1=a[1];n.x2=b[0];n.y2=b[1]}
  else{var a2=f(o.x,o.y),b2=f(o.x+o.w,o.y+o.h);n.x=a2[0];n.y=a2[1];n.w=b2[0]-a2[0];n.h=b2[1]-a2[1]}
  return n}

/*GEOM*/
function L(p,d){return{p:p,d:d||0}}
function arcP(cx,cy,rx,ry,a0,a1,n){var r=[];for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;r.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return r}
function ahead(ax,ay,bx,by,H){var a=Math.atan2(by-ay,bx-ax);return L([[bx-H*Math.cos(a-.45),by-H*Math.sin(a-.45)],[bx,by],[bx-H*Math.cos(a+.45),by-H*Math.sin(a+.45)]])}
function dash(d,w){return d===2?[.1,w*2.4]:d===1?[w*3,w*3]:[]}
function geom(o){
  var x1=o.x1,y1=o.y1,x2=o.x2,y2=o.y2,xa=Math.min(x1,x2),xb=Math.max(x1,x2),ya=Math.min(y1,y2),yb=Math.max(y1,y2),w=xb-xa,h=yb-ya,cx=(xa+xb)/2,cy=(ya+yb)/2,P=Math.PI,H=12+o.w*2,i,t,a,r,ry,d;
  switch(o.k){
  case"dotted":return[L([[x1,y1],[x2,y2]],2)];
  case"arrow":return[L([[x1,y1],[x2,y2]]),ahead(x1,y1,x2,y2,H)];
  case"axes":return[L([[xa,cy],[xb,cy]]),ahead(xa,cy,xb,cy,H),L([[cx,yb],[cx,ya]]),ahead(cx,yb,cx,ya,H)];
  case"tri":return[L([[cx,ya],[xb,yb],[xa,yb],[cx,ya]])];
  case"rtri":return[L([[xa,ya],[xa,yb],[xb,yb],[xa,ya]])];
  case"rect":return[L([[xa,ya],[xb,ya],[xb,yb],[xa,yb],[xa,ya]])];
  case"square":{var s=Math.max(w,h),ex=x1+(x2>=x1?s:-s),ey=y1+(y2>=y1?s:-s);return[L([[x1,y1],[ex,y1],[ex,ey],[x1,ey],[x1,y1]])]}
  case"diamond":return[L([[cx,ya],[xb,cy],[cx,yb],[xa,cy],[cx,ya]])];
  case"pent":return[L(arcP(cx,cy,w/2,h/2,-P/2,1.5*P,5))];
  case"hex":return[L(arcP(cx,cy,w/2,h/2,0,2*P,6))];
  case"star":{var q=[];for(i=0;i<=10;i++){a=-P/2+i*P/5;r=i%2?.4:1;q.push([cx+r*w/2*Math.cos(a),cy+r*h/2*Math.sin(a)])}return[L(q)]}
  case"circle":{r=Math.hypot(x2-x1,y2-y1);return[L(arcP(x1,y1,r,r,0,2*P,72))]}
  case"ellipse":return[L(arcP(cx,cy,w/2,h/2,0,2*P,72))];
  case"parab":{var Ln=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/Ln,uy=(y2-y1)/Ln,q2=[];for(i=-30;i<=30;i++){t=i/30;q2.push([x1+ux*Ln*t*t-uy*Ln*t*.8,y1+uy*Ln*t*t+ux*Ln*t*.8])}return[L(q2)]}
  case"hyper":{var T=1.3,A=(w/2)/Math.cosh(T)||.1,B=(h/2)/Math.sinh(T)||.1,rt=[],lf=[];for(i=-24;i<=24;i++){t=T*i/24;rt.push([cx+A*Math.cosh(t),cy+B*Math.sinh(t)]);lf.push([cx-A*Math.cosh(t),cy+B*Math.sinh(t)])}
    var sl=B/A*w/2;return[L(rt),L(lf),L([[xa,cy-sl],[xb,cy+sl]],1),L([[xa,cy+sl],[xb,cy-sl]],1)]}
  case"cube":{d=Math.min(w,h)*.35;var fw=w-d,A1=[xa,ya+d],B1=[xa+fw,ya+d],C1=[xa+fw,yb],D1=[xa,yb],A2=[xa+d,ya],B2=[xb,ya],C2=[xb,yb-d],D2=[xa+d,yb-d];
    return[L([A1,B1,C1,D1,A1]),L([A1,A2,B2,B1]),L([B2,C2,C1]),L([D1,D2],1),L([D2,A2],1),L([D2,C2],1)]}
  case"cyl":{ry=Math.min(h*.15,w*.25);return[L(arcP(cx,ya+ry,w/2,ry,0,2*P,60)),L(arcP(cx,yb-ry,w/2,ry,0,P,30)),L(arcP(cx,yb-ry,w/2,ry,P,2*P,30),1),L([[xa,ya+ry],[xa,yb-ry]]),L([[xb,ya+ry],[xb,yb-ry]])]}
  case"cone":{ry=Math.min(h*.15,w*.25);return[L([[xa,yb-ry],[cx,ya],[xb,yb-ry]]),L(arcP(cx,yb-ry,w/2,ry,0,P,30)),L(arcP(cx,yb-ry,w/2,ry,P,2*P,30),1)]}
  case"sphere":{r=Math.min(w,h)/2;return[L(arcP(cx,cy,r,r,0,2*P,72)),L(arcP(cx,cy,r,r*.3,0,P,30)),L(arcP(cx,cy,r,r*.3,P,2*P,30),1)]}
  default:return[L([[x1,y1],[x2,y2]])]}}
/*ENDGEOM*/

/* ---------- drawing ---------- */
var imgs={};
function getImg(o){if(!imgs[o.id]){var im=new Image();im.onload=function(){drawAll()};im.src=o.src;imgs[o.id]=im}return imgs[o.id]}
function drawObj(c,o){
  c.save();c.lineCap="round";c.lineJoin="round";c.strokeStyle=o.color;c.fillStyle=o.color;

  editObj=o;editI=i;draw(i);var ta=document.createElement("textarea");ta.className="tbx";ta.value=o.text;ta.placeholder="Type…";posTA(ta,o,pg);
  els[i].sh.appendChild(ta);editTA=ta;ta.focus();
  ta.oninput=function(){o.text=ta.value;fitBox(o);posTA(ta,o,pg)};ta.onblur=function(){endEdit()}}

  var pg=cur&&cur.pages[i];if(pg&&o){o.text=ta.value;if(!o.text.trim()){var ix=pg.objs.indexOf(o);if(ix>-1)pg.objs.splice(ix,1);sel=null}else fitBox(o)}
  if(pg&&els[i])draw(i);save();upd()}

var fsOn=false,fsNative=false;
function fitPages(){if(!cur)return;var sc=$("scroll"),aw=sc.clientWidth-16,ah=sc.clientHeight-24;
  els.forEach(function(e,i){var pg=cur.pages[i];e.wrap.style.width=fsOn?Math.max(200,Math.min(aw,ah*W/pg.h))+"px":"";
    var cssW=e.cv.getBoundingClientRect().width||W,want=fsOn?Math.min(2,Math.max(1,cssW*(window.devicePixelRatio||1)/W)):1;want=Math.round(want*10)/10;
    if(Math.abs(want-e.sc)>.05){e.sc=want;e.cv.width=Math.round(W*want);e.cv.height=Math.round(pg.h*want);e.ctx.setTransform(want,0,0,want,0,0);draw(i)}})}
function setFS(on){fsOn=on;document.body.classList.toggle("fs",on);var el=document.documentElement;
  if(on){fsNative=false;try{var rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){var r=rq.call(el);fsNative=true;if(r&&r.catch)r.catch(function(){fsNative=false})}}catch(e){}}
  else{try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
  setIcon($("fsBtn"),on?"fsx":"fs",on?"Exit full screen":"Full screen");sel=null;fitPages();drawAll();upd()}

function stepPage(d){if(!els.length)return;var top=$("scroll").getBoundingClientRect().top,best=0,bd=1e9;
  els.forEach(function(e,i){var dd=Math.abs(e.wrap.getBoundingClientRect().top-top);if(dd<bd){bd=dd;best=i}});
  var n=Math.max(0,Math.min(els.length-1,best+d));els[n].wrap.scrollIntoView({behavior:"smooth",block:"center"})}
